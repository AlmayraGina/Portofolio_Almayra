<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="asset/logocb.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;500;600;700&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="css/style.css">
</head>
<body>


<header>
    <nav class="navigation">
        <div class="logo">
            <img src="asset/logocb.png" alt="Logo">
            <h1>Clash of BaNG</h1>
        </div>

        <ul class="nav-links" id="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="troops.html">Troops</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>

        <div class="menu-toggle" id="menu-toggle">☰</div>
    </nav>
</header>






<section class="form-section">

    <h2>Are You Ready Clash Princess?</h2>

<form id="registerForm">

    <input type="text" id="name" placeholder="Enter your Clasher name">

    <input type="email" id="email" placeholder="Enter email">

    <div class="gender-group">
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
    </div>

    <input type="number" id="age" placeholder="Enter age">

    <select id="troop">
        <option value="">Choose Favorite Troop</option>
        <option>Elphabians</option>
        <option>Mayrulia</option>
        <option>Wendigoes</option>
        <option>Jamoor</option>
        <option>Fearien</option>
        <option>Banshees</option>
    </select>

    <textarea id="reason" placeholder="Why would you like to join Clash of BaNG?"></textarea>

    <button type="submit">Register</button>
    <br>

</form>

</section>










<footer>
    <p>Clash of BaNG 2026</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
